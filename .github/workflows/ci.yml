name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pylint:
    uses: coatl-dev/workflows/.github/workflows/pylint.yml@0d24a98543a7e17f432503425e6ef836972864bb # v7.0.28
    with:
      path: src

  tox:
    if: ${{ github.event_name == 'pull_request' }}
    uses: $/.github/workflows/tox.yml
